name: Publish reviewed dashboard forecast note update
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 20f8fec4ba380dd8a42ed3aeddf7112575d9f0d3
          path: published
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: overlay
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: data/forecast-note-reviewed-index.html
      - name: Stage the previously published site and verified index
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/reviewed-dashboard"
          git -C published archive HEAD | tar -x -C "$RUNNER_TEMP/reviewed-dashboard"
          cd "$RUNNER_TEMP/reviewed-dashboard"
          echo "a15acf283fb265251dc4b843b483734068bf09ad4ed117fa53cbc803afd958be  index.html" | sha256sum -c
          cp "$GITHUB_WORKSPACE/overlay/data/forecast-note-reviewed-index.html" index.html
          echo "6ebee7d62bac4d1fa8c443eb77383fd7d42c5d8295ded6dc1424a2e100ecef66  index.html" | sha256sum -c
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/reviewed-dashboard
      - id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
