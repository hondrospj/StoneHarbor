name: Refresh selected dashboard tools four times daily

on:
  schedule:
    # PETSS station archives arrive about six hours and 15 minutes after issuance.
    - cron: "35 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selected-dashboard-six-hour-chain-v1
  cancel-in-progress: false

jobs:
  refresh-forecast:
    uses: ./.github/workflows/refresh-dashboard-petss.yml
    secrets: inherit
  refresh-individual-high-tides:
    # Both jobs publish to the same apps. Keep them serial, even if PETSS fails.
    needs: refresh-forecast
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/refresh-selected-high-tides.yml
    secrets: inherit
